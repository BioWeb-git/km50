# Configuration optimisée pour km50.fr
contao:
  search:
    listener:
      index: false
      delete: false
    default_indexer:
      enable: false
  upload_path: files
  image:
    preview:
      max_size: 2048

framework:
  http_cache:
    enabled: true
  cache:
    app: cache.adapter.redis
    default_redis_provider: redis://localhost
  mailer:
    transports:
      mailtrap: '%env(MAILER_TRANSPORT_MAILTRAP)%'
      mailjet: '%env(MAILER_TRANSPORT_MAILJET)%'